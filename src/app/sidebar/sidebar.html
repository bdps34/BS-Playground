@if (!collapsed()) {
  <!-- Mouse-only shortcut; keyboard users close the sidebar with the "Collapse sidebar" button. -->
  <div class="sidebar__backdrop" aria-hidden="true" (click)="close()"></div>
}
<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__header">
    <span class="sidebar__brand" aria-hidden="true"></span>
    <button
      class="sidebar__icon-button"
      type="button"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      (click)="toggleCollapsed()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
        <line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>
  </div>

  <nav class="sidebar__actions" aria-label="Chat actions">
    <button class="sidebar__action" type="button" aria-label="New Chat" (click)="newChat.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M4 20l1.1-4.4L16.4 4.3a1 1 0 011.4 0l2.9 2.9a1 1 0 010 1.4L9.4 19.9 4 21z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
      </svg>
      @if (!collapsed()) {
        <span aria-hidden="true">New Chat</span>
      }
    </button>

    <button class="sidebar__action" type="button" aria-label="Search in Chat" (click)="expand()">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" />
      </svg>
      @if (!collapsed()) {
        <span aria-hidden="true">Search in Chat</span>
      }
    </button>
  </nav>

  @if (!collapsed()) {
    <chat-history
      class="sidebar__history"
      [conversations]="conversations()"
      [selectedId]="selectedConversationId()"
      (conversationSelected)="selectConversation.emit($event)"
    />
  }

  <button class="sidebar__logout" type="button" aria-label="Logout" (click)="logout.emit()">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M15 3h4a1 1 0 011 1v16a1 1 0 01-1 1h-4M10 17l5-5-5-5M15 12H3"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    @if (!collapsed()) {
      <span aria-hidden="true">Logout</span>
    }
  </button>
</aside>
